{% extends 'page.html' %}

{% block head_title %}{{ ghostform.title }}{% endblock %}

{% block content %}
<h1>{{ ghostform.title }}</h1>
<div class="stack stack--md">
  <p>Thanks! Your response has been recorded.</p>
  {% if ghostform.is_accepting_responses %}
  <div class="cluster">
    <a href="{% url 'ghostform:ghostform-fill' ghostform.code %}" class="button">Submit another response</a>
  </div>
  {% endif %}
</div>
{% endblock %}
