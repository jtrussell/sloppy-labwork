{% extends base_template %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'timekeeper/timer.css' %}">
{% endblock %}

{% block content %}
<header class="page-header">
    <a href="{% url 'timekeeper:timer_create' %}" class="back-link">My Timers</a>
</header>

<section>
    <div class="timer timer--not-found">
        <div class="timer__countdown">--:--</div>
        <div class="timer__message">Timer not found or has been cancelled.</div>
    </div>
</section>
{% endblock %}
