{% extends "pmc/_base.html" %}

{% block staff_strip %}{% include 'pmc/_staff-strip.html' %}{% endblock %}

{% block content %}
<div class="stack staff-only">
  <h1>Add Venue</h1>

  <form method="POST" class="card card--staff">
    <p class="staff-tag">Staff</p>
    {% csrf_token %}
    {% include 'pmc/_form-fields.html' with form=form %}
    <div class="form__actions">
      <a href="{% url 'pmc-pg-manage' playgroup.slug %}" class="btn btn--ghost">Cancel</a>
      <button type="submit" class="btn btn--staff btn--solid">Add Venue</button>
    </div>
  </form>
</div>
{% endblock %}
