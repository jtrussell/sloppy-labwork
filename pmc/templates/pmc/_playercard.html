{% load static %}
<div class="playercard{% if pinned_awards %} playercard--pinned{% endif %}">
  <div
    class="playercard__banner"
    style="--playercard-banner-bg: #{{ my_profile.get_avatar.banner_bg_color }}; --playercard-banner-text: #{{ my_profile.get_avatar.banner_text_color }}; --playercard-banner-stroke: #{{ my_profile.get_avatar.banner_stroke_color }}"
  >
    <img class="playercard__avatar" src="{{ my_profile.get_avatar.src }}" alt="{{ my_profile.get_avatar.name }}">
    <div class="playercard__identity">
      <span class="playercard__name">{{ my_profile.user }}</span>
      <span class="playercard__tagline">{{ my_profile.tagline | default:'Silence is golden.' }}</span>
    </div>
  </div>

  {% if my_profile.mv_qrcode_message and my_profile.user == request.user and not hide_qr_code %}
    <img
      class="playercard__qr"
      src="https://static.sloppylabwork.com/{{ my_profile.get_mv_qrcode_path }}"
      alt="Master Vault QR Code"
      tabindex="-1"
      data-playercard-revealed>
    <button
      type="button"
      class="playercard__shield"
      data-playercard-reveal
      aria-label="Reveal QR Code">
      <img
        class="playercard__shield-pattern"
        src="{% static 'pmc/img/qr-code-placeholder.png' %}"
        alt="">
      <span class="playercard__shield-text">[REDACTED]<br>Click to reveal</span>
    </button>
    <script src="{% static 'pmc/scripts/playercard.js' %}" defer></script>
  {% endif %}

  {% if pinned_awards %}
    <div class="playercard__pins">
      {% for award in pinned_awards %}
        <a href="{{ award.detail_url }}" class="playercard__pin">
          <img src="{{ award.src }}" alt="{{ award.name }}" class="playercard__pin-art">
        </a>
      {% endfor %}
    </div>
  {% endif %}

  <img class="playercard__background" src="{{ my_profile.get_background.src }}" alt="{{ my_profile.get_background.name }}">
</div>
