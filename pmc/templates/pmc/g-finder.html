{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ my_profile.theme|default:0 }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="referrer" content="strict-origin-when-cross-origin">

	<link rel="manifest" href="{% static 'manifest.json' %}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{% static 'pmc/css/keychain.css' %}">

	<link rel="icon" type="image/png" href="{% static 'pmc/img/favicon.png' %}">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="" />
	<link rel="stylesheet" href="{% static 'pmc/css/finder-card.css' %}" />
	<link rel="stylesheet" href="{% static 'pmc/css/finder.css' %}" />

	<title>Find a Group — KeyChain</title>
</head>

<body class="finder-page">
	<header class="finder-chrome" id="finder-chrome" data-theme="0">
		<a href="{% url 'pmc-my-keychain' %}" class="wordmark finder-chrome__wordmark" aria-label="KeyChain"></a>
		<button
			type="button"
			class="finder-chrome__toggle"
			id="finder-menu-toggle"
			aria-controls="finder-nav"
			aria-expanded="false"
			aria-label="Menu"
		><span class="finder-chrome__bars"></span></button>
		<nav class="finder-chrome__nav" id="finder-nav" aria-label="Primary">
			{% for link in nav_links %}
			<a
				href="{{ link.url }}"
				class="finder-chrome__link"
				{% if link.is_active %}aria-current="page"{% endif %}
			>{{ link.name }}</a>
			{% endfor %}
		</nav>
	</header>

	<main class="finder-layout" id="finder-layout">
		<section class="finder-panel" id="finder-panel" data-sheet-state="peek" aria-labelledby="finder-title">
			<button
				type="button"
				class="finder-panel__handle"
				id="finder-sheet-handle"
				aria-controls="finder-panel"
				aria-expanded="false"
				aria-label="Resize results panel"
			></button>

			<h1 class="finder-panel__title" id="finder-title">Find a Group</h1>

			<input
				type="search"
				id="finder-search-input"
				placeholder="Search groups, venues, places..."
				aria-label="Search groups, venues, places"
				autocomplete="off"
				enterkeyhint="search"
			/>

			<div class="finder-panel__tools">
				<details class="disclosure">
					<summary>Filters</summary>
					<div class="stack stack--sm">
						<div class="field">
							<label class="field__label" for="finder-event-format">Format</label>
							<select id="finder-event-format">
								<option value="">All</option>
								{% for fmt in event_formats %}
								<option value="{{ fmt.id }}">{{ fmt.name }}</option>
								{% endfor %}
								<option value="other">Other</option>
							</select>
						</div>

						<label class="switch-row">
							<span>Upcoming Events</span>
							<input type="checkbox" class="switch" id="finder-upcoming-events" />
						</label>
					</div>
				</details>
				<a class="finder-panel__view-link" href="{% url 'pmc-finder-table' %}">Table view</a>
			</div>

			<div class="finder-panel__summary muted text-sm" id="finder-results-summary" aria-live="polite"></div>
			<ul class="finder-results" id="finder-results"></ul>
			<div class="pagination finder-panel__pagination" id="finder-pagination" hidden>
				<button type="button" class="btn btn--sm btn--ghost" id="finder-page-previous" aria-label="Previous page">Prev</button>
				<span class="pagination__info" id="finder-page-label"></span>
				<button type="button" class="btn btn--sm btn--ghost" id="finder-page-next" aria-label="Next page">Next</button>
			</div>
		</section>

		<div class="finder-map" id="finder-map"></div>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
	<script>window.FINDER_API_URL = '{% url "pmc-finder-data" %}';</script>
	<script src="{% static 'pmc/scripts/finder-dates.js' %}"></script>
	<script src="{% static 'pmc/scripts/finder.js' %}"></script>
</body>
</html>
