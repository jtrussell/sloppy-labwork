{% load static %}

<div id="award-shelf" class="card">
  <h2 class="card__title">Award Shelf</h2>
  <p class="muted">Pin up to 5 awards to display on your playercard.</p>

  <div class="award-shelf__slots" id="award-shelf-slots">
    {% for award in pinned_awards %}
      <div class="award-shelf__item drag-drop-item"
           data-key="{{ award.pk }}"
           draggable="true">
        <img src="{{ award.src }}" alt="{{ award.name }}" class="award-shelf__art">
        <button
          type="button"
          class="award-shelf__unpin"
          hx-post="{% url 'pmc-unpin-award' award.pk %}"
          hx-target="#awards-content"
          hx-swap="outerHTML show:none"
          aria-label="Unpin {{ award.name }}"
          title="Unpin {{ award.name }}">
          <span class="award-shelf__unpin-badge">{% include 'pmc/_icon.html' with name='close' class_name='icon--sm' %}</span>
        </button>
      </div>
    {% endfor %}

    {% for _ in "xxxxx"|make_list %}
      {% if forloop.counter > pin_count %}
        <div class="award-shelf__placeholder">
          {% include 'pmc/_icon.html' with name='plus' %}
        </div>
      {% endif %}
    {% endfor %}
  </div>

  <p class="award-shelf__count">{{ pin_count }} / 5 pinned</p>
</div>
