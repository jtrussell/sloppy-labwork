{% extends "pmc/_base.html" %}

{% block content %}
  <h1>Ladders</h1>

  <div class="card staff-only">
    <h2>Staff Area</h2>
    <a href="{% url 'pmc-pg-ladder-new' playgroup.slug %}" class="btn btn-solid btn-block">Add Ladder</a>
  </div>

  <ul class="card-list">
    {% for ladder in ladders %}
      {% include 'pmc/_ladder-card.html' %}
    {% empty %}
      <li class="card text-muted">No ladders yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
