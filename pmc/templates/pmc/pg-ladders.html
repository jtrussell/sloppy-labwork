{% extends "pmc/_base.html" %}

{% block content %}
  <div class="page-header">
    <h1>Ladders</h1>
    <a class="staff-link staff-only" href="{% url 'pmc-pg-ladder-new' playgroup.slug %}">{% include 'pmc/_icon.html' with name='shield' class_name='icon--sm' %}Add ladder</a>
  </div>

  <ul class="card-list">
    {% for ladder in ladders %}
      {% include 'pmc/_ladder-card.html' %}
    {% empty %}
      <li class="card muted">No ladders yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
