{% extends "pmc/_base.html" %}

{% block extra_head %}
  {% include 'pmc/_competition-assets.html' %}
{% endblock %}

{% block content %}
  <div class="page-heading">
    <h1>Ladders</h1>
    <a class="staff-only" href="{% url 'pmc-pg-ladder-new' playgroup.slug %}">Add ladder</a>
  </div>

  <ul class="card-list">
    {% for ladder in ladders %}
      {% include 'pmc/_ladder-card.html' %}
    {% empty %}
      <li class="card text-muted">No ladders yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
