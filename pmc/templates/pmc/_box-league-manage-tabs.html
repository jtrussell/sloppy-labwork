<div class="page-header">
  <h1>{{ league.name }}</h1>
  <a href="{% url 'pmc-pg-box-league-detail' playgroup.slug league.pk %}">View league</a>
</div>
<nav class="segmented" aria-label="Manage {{ league.name }}">
  <a class="segmented__option" href="{% url 'pmc-pg-box-league-manage' playgroup.slug league.pk %}"{% if active_tab == 'players' %} aria-current="page"{% endif %} data-preserve-scroll>Players</a>
  <a class="segmented__option" href="{% url 'pmc-pg-box-league-manage' playgroup.slug league.pk %}?tab=sessions"{% if active_tab == 'sessions' %} aria-current="page"{% endif %} data-preserve-scroll>Sessions</a>
  <a class="segmented__option" href="{% url 'pmc-pg-box-league-edit' playgroup.slug league.pk %}"{% if active_tab == 'settings' %} aria-current="page"{% endif %}>Settings</a>
</nav>
