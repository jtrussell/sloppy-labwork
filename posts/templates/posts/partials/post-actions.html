{% if perms.posts.change_post or perms.posts.delete_post %}
<details class="action-menu">
  <summary class="action-menu__trigger" aria-label="Actions for {{ post.title }}">{% include "components/icon.html" with name="more" %}</summary>
  <ul class="action-menu__list">
    {% if perms.posts.change_post %}
    <li><a href="{% url 'posts-edit' post.slug %}" class="action-menu__item">Edit post</a></li>
    {% endif %}
    {% if perms.posts.delete_post %}
    <li>
      <form method="post" action="{% url 'posts-delete' post.slug %}">
        {% csrf_token %}
        <button type="submit" class="action-menu__item action-menu__item--danger" hx-post="{% url 'posts-delete' post.slug %}" hx-confirm="Are you sure you want to delete this post?">Delete post</button>
      </form>
    </li>
    {% endif %}
  </ul>
</details>
{% endif %}
