{% extends "page-full.html" %}

{% block content %}
  <p class="h3">You're playing {{ matched_with }}.</p>

  <p>Look for them at the <em>meeting point</em>... or... you know... wherever.</p>

  <div class="stack stack--sm">
    <form method="POST">
      {% csrf_token %}
      {{ record_form }}
      <button class="button button-primary button-jumbo h4" type="submit">We Played</button>
    </form>

    <form method="POST">
      {% csrf_token %}
      {{ cancel_form }}
      <button type="submit" class="button button-jumbo h4">Cancel</button>
    </form>
  </div>
{% endblock %}
