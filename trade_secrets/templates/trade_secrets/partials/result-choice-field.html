<fieldset class="ts-result-form__question">
  <legend>{{ field.label }}{% if not field.field.required %} <span class="ts-result-form__optional">Optional</span>{% endif %}</legend>
  <div class="ts-result-form__options">
    {% for value, label in field.field.choices %}
    <label class="ts-result-form__option"><input type="radio" name="{{ field.html_name }}" value="{{ value }}"{% if field.value|stringformat:"s" == value %} checked{% endif %}{% if field.field.required %} required{% endif %}><span>{{ label }}</span></label>
    {% endfor %}
  </div>
  {% if help_text %}<p class="field__help">{{ help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="text-danger">{{ error }}</p>{% endfor %}
</fieldset>
