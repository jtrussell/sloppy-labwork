<article class="ts-template-card surface">
  <div class="ts-template-card__header">
    <h3 class="ts-template-card__name"><a href="{% url 'trade_secrets:template-detail' card.template.code %}">{{ card.template.name }}</a></h3>
    {% if card.template.is_system %}<span class="ts-status ts-status--standard">Standard</span>{% endif %}
  </div>
  {% include 'trade_secrets/partials/step-rail.html' with rail=card.rail mini=True %}
  <p class="ts-template-card__summary">{{ card.summary }}</p>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'trade_secrets:session-create' %}">
    {% csrf_token %}
    <input type="hidden" name="template_code" value="{{ card.template.code }}">
    <button type="submit" class="button button-primary ts-template-card__start">Start</button>
  </form>
  {% else %}
  <a class="button ts-template-card__start" href="{% url 'account_login' %}?next={{ request.path|urlencode }}">Log in to start</a>
  {% endif %}
</article>
