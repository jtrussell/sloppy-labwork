<div id="message-list" class="message-list" role="status">
  {% for message in messages %}
  {% include "components/message.html" with level=message.level_tag text=message %}
  {% endfor %}
  {% for message in error_messages %}
  {% include "components/message.html" with level="error" text=message %}
  {% endfor %}
</div>
<template id="message-template">
  {% include "components/message.html" with level="" text="" %}
</template>
