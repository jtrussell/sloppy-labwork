{% load static %}
<!doctype html>
<html class="no-js" lang="" data-theme="{{ user.profile.theme }}">

<head>
  <meta charset="utf-8">
  <title>{%block head_title %}Sloppy Labwork{% endblock %}</title>
  <meta name="description" content="Resources for the KeyForge community and event organizers">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon-5.0.svg' %}">

  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  
  <!--
  <meta name="theme-color" content="#fafafa">
  -->
  {% block extra_head %}
    <!-- Custom head content -->
  {% endblock %}
</head>

<body class="preload">
  {% block body %}
  <main role="main" class="container stack text-center">
    {% include 'components/messages.html' %}

    <div class="stack__spacer"></div>

    {% block content %}
      <!-- Silence is golden -->
    {% endblock %}

    <div class="stack__spacer"></div>
    {% if footer_text %}
      <span class="page-full__footer-text text-muted">{{ footer_text }}</span>
    {% endif %}
    {% endblock %}
  </main>

  <script>
    // Used to avoid CSS animations on the initial load
    setTimeout(function () {
      document.querySelector('body').classList.remove('preload')
    }, 1000)
  </script>
</body>

</html>
