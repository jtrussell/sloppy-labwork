{% extends "tourney/_base.html" %}

{% block content %}
<header class="page-header">
    <a href="{% url 'tourney:tourney-tournament-detail-admin' tournament.code %}" class="back-link">{{ tournament.name }}</a>
    <h1>Export to KeyChain</h1>
</header>

<form method="post" class="form-wide stack stack--md">
    {% csrf_token %}
    <p class="text-muted">Select a playgroup to export this tournament's standings to KeyChain.</p>
    {% include "components/form-fields.html" %}
    <div class="form-actions">
        <button type="submit" class="button button-primary">Continue</button>
        <a href="{% url 'tourney:tourney-tournament-detail-admin' tournament.code %}" class="button">Cancel</a>
    </div>
</form>
{% endblock %}
