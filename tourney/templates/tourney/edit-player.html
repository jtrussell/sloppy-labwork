{% extends "tourney/_base.html" %}

{% block content %}
<header class="page-header">
    <a href="{% url 'tourney:tourney-manage-players' tournament.code %}" class="back-link">Manage Players</a>
    <h1>Edit Player</h1>
    <div class="subheading">{{ player.get_display_name }} · {{ tournament.name }}</div>
</header>

<form method="post" class="form-wide stack stack--md" autocomplete="off">
    {% csrf_token %}
    {% include "tourney/partials/player-fields.html" with nickname_help="Required if no username is provided" %}
    <div class="form-actions">
        <button type="submit" class="button button-primary">Save Changes</button>
        <a href="{% url 'tourney:tourney-manage-players' tournament.code %}" class="button">Cancel</a>
    </div>
</form>
{% endblock %}
