{% extends 'page.html' %}
{% load static %}

{% block head_title %}My Lineups - Sloppy Labwork{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'lineups/main.css' %}">
{% endblock %}

{% block content %}
<header class="page-header">
  <div class="page-header__title-row">
    <h1>My Lineups</h1>
    <div class="page-header__actions">
      <a href="{% url 'lineups-create' %}" class="button button-primary">New Lineup</a>
    </div>
  </div>
</header>

<div class="stack stack--lg">
  <form role="search" hx-get="{% url 'lineups-list' %}" hx-target="#lineup-results" hx-swap="innerHTML" hx-trigger="input delay:300ms from:#search-input, change from:#format-select">
    <div class="field">
      <label class="sr-only" for="search-input">Search lineups</label>
      <input type="search" name="q" id="search-input" value="{{ search_query }}" placeholder="Search lineups..." aria-describedby="search-input-help">
      <div class="field__help" id="search-input-help">Type to search</div>
    </div>
  </form>

  <div id="lineup-results" class="stack stack--lg">
    {% include 'lineups/partials/lineup-list-results.html' %}
  </div>
</div>
{% endblock %}
