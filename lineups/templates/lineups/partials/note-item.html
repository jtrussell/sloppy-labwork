{% load posts_extras %}
<li class="card" id="note-{{ note.id }}">
  <div class="lineup-note__content">
    {{ note.text|markdown|safe }}
  </div>
  <div class="card__footer">
    <span class="card__meta">{{ note.created_on|date:"M j, Y g:i A" }}</span>
    {% if is_owner %}
    <span class="spacer"></span>
    <button type="button" class="button button-small" hx-get="{% url 'lineups-note-edit' lineup.code note.id %}" hx-target="#note-{{ note.id }}" hx-swap="outerHTML">Edit</button>
    <form method="post" action="{% url 'lineups-note-delete' lineup.code note.id %}">
      {% csrf_token %}
      <button type="submit" class="button button-small button-danger" hx-post="{% url 'lineups-note-delete' lineup.code note.id %}" hx-target="#note-{{ note.id }}" hx-swap="outerHTML" hx-confirm="Delete this note?">Delete</button>
    </form>
    {% endif %}
  </div>
</li>
