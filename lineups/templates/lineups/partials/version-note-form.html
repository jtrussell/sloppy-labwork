<li class="card" id="version-note-{{ note.id }}">
  <form method="post" action="{% url 'lineups-version-note-edit' version.code note.id %}" hx-post="{% url 'lineups-version-note-edit' version.code note.id %}" hx-target="#version-note-{{ note.id }}" hx-swap="outerHTML" class="stack stack--sm">
    {% csrf_token %}
    {% include "components/field.html" with field=form.text %}
    <div class="form-actions form-actions--end">
      <button type="button" class="button button-small" hx-get="{% url 'lineups-version-note-edit' version.code note.id %}" hx-target="#version-note-{{ note.id }}" hx-swap="outerHTML" hx-vals='{"cancel": "true"}'>Cancel</button>
      <button type="submit" class="button button-primary button-small">Save</button>
    </div>
  </form>
</li>
